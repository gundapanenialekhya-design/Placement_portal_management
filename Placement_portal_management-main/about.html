<!DOCTYPE html>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            background-image: url('colors.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
        }

        .about-section {
            padding: 50px;

            background-color: #474e5d;

        .row {

            flex-wrap: wrap;

        .column {
            flex: 1 1 300px;
            max-width: 300px;

            margin-bottom: 16px;
        }

        .card {
            background-color: white;
            box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
            padding: 16px;
            margin: 16px 0;
            border-radius: 10px;
        }

        .container {
            text-align: center;
        }

        .title {
            color: grey;
            font-size: 18px;
        }

        h2 {
            font-size: 24px;
            margin: 16px 0;
        }

        p {
            font-size: 14px;
            margin: 8px 0;
        }

        .button {
            border: none;
            outline: 0;
            display: inline-block;
            padding: 10px;
            color: white;
            background-color: #000;
            text-align: center;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }

        .button:hover {
            background-color: #555;
        }

        @media screen and (max-width: 650px) {
            .column {
                flex-basis: 100%;
            }
        }
    </style>
</head>
